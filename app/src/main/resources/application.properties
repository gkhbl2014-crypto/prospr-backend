spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase's pooled connection endpoint already pools upstream; keep the local Hikari pool small.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=SupabaseHikariPool

# Tables are already created/managed in Supabase; validate entities against them, never auto-migrate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Setu sessions can carry thousands of transactions; batch inserts so a bulk save is a handful of
# round-trips instead of one-per-row (which was long enough to hit a connection reset mid-transaction).
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

