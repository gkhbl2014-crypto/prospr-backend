setu:
  auth-url: ${SETU_AUTH_URL:https://orgservice-prod.setu.co/v1/users/login}
  consent-url: ${SETU_CONSENT_URL:https://fiu-sandbox.setu.co/v2/consents}
  session-url: ${SETU_SESSION_URL:https://fiu-sandbox.setu.co/v2/sessions}
  base-url: ${SETU_BASE_URL:https://fiu-sandbox.setu.co/v2}
  redirect-url: ${SETU_REDIRECT_URL:https://print-moustache-tricolor.ngrok-free.dev/app/setu/consent-complete}
  client-id: ${SETU_CLIENT_ID:9417c471-d0b7-4db3-b253-d081cc9061e1}
  client-secret: ${SETU_CLIENT_SECRET:r29oiasr7oaT7VlTRqnfG55zutVxnTIk}
  product-instance-id: ${SETU_PRODUCT_INSTANCE_ID:2c53c5f3-33fe-47ad-a0f1-ec354232fde3}
  client: ${SETU_CLIENT:bridge}
  format: ${SETU_SESSION_FORMAT:xml}
  consent-duration:
    unit: ${SETU_CONSENT_DURATION_UNIT:MONTH}
    value: ${SETU_CONSENT_DURATION_VALUE:24}
  data-range:
    from: ${SETU_DATA_RANGE_FROM:2022-12-01T00:00:00Z}
    to: ${SETU_DATA_RANGE_TO:2023-08-12T00:00:00Z}

lifestyle:
  baseline-months: ${LIFESTYLE_BASELINE_MONTHS:6}
  low-threshold-percent: ${LIFESTYLE_LOW_THRESHOLD_PERCENT:15}
  medium-threshold-percent: ${LIFESTYLE_MEDIUM_THRESHOLD_PERCENT:30}
  high-threshold-percent: ${LIFESTYLE_HIGH_THRESHOLD_PERCENT:50}
  critical-threshold-percent: ${LIFESTYLE_CRITICAL_THRESHOLD_PERCENT:75}
  min-increase-percent-for-insight: ${LIFESTYLE_MIN_INCREASE_PERCENT:30}
  min-absolute-difference-inr: ${LIFESTYLE_MIN_ABSOLUTE_DIFFERENCE_INR:500}

financial-analysis:
  snapshot-history-months: ${FINANCIAL_ANALYSIS_SNAPSHOT_HISTORY_MONTHS:12}

recurring-expense:
  min-occurrences: ${RECURRING_MIN_OCCURRENCES:3}
  amount-tolerance-percent: ${RECURRING_AMOUNT_TOLERANCE_PERCENT:10.0}
  amount-tolerance-floor-inr: ${RECURRING_AMOUNT_TOLERANCE_FLOOR_INR:50.0}
  monthly-interval-tolerance-days: ${RECURRING_MONTHLY_INTERVAL_TOLERANCE_DAYS:4}
  quarterly-interval-tolerance-days: ${RECURRING_QUARTERLY_INTERVAL_TOLERANCE_DAYS:7}
  annual-interval-tolerance-days: ${RECURRING_ANNUAL_INTERVAL_TOLERANCE_DAYS:14}
  active-lapse-multiplier: ${RECURRING_ACTIVE_LAPSE_MULTIPLIER:1.5}
  high-confidence-min-occurrences: ${RECURRING_HIGH_CONFIDENCE_MIN_OCCURRENCES:4}
  high-confidence-amount-tolerance-percent: ${RECURRING_HIGH_CONFIDENCE_AMOUNT_TOLERANCE_PERCENT:5.0}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT_MS:2000}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:2000}

prospr:
  cache:
    enabled: ${PROSPR_CACHE_ENABLED:true}
    lifestyle-creep-ttl-minutes: ${PROSPR_CACHE_LIFESTYLE_CREEP_TTL:30}
    safety-net-ttl-minutes: ${PROSPR_CACHE_SAFETY_NET_TTL:30}
    spending-summary-ttl-minutes: ${PROSPR_CACHE_SPENDING_SUMMARY_TTL:30}